<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Worktown3D</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏢</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/phone.css" />
    <link rel="stylesheet" href="/css/customizer.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/build/three.module.js",
          "three/addons/": "/vendor/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="hud" class="hidden">
      <div id="floor-chip"><span id="floor-badge">G</span><span id="floor-title"></span></div>
      <button id="online-chip" class="hidden" title="Who's in the building right now"></button>
      <div id="crosshair"></div>
      <div id="hint"></div>
      <div id="keys"><kbd>WASD</kbd> move · <kbd>Shift</kbd> run · <kbd>E</kbd> interact · <kbd>P</kbd> phone · <kbd>Esc</kbd> pause</div>
      <button id="phone-chip" title="Phone (P)">📱 <kbd>P</kbd><span class="badge"></span></button>
    </div>

    <div id="phone-root" aria-label="Phone"></div>
    <div id="flash"></div>

    <div id="toasts"></div>
    <div id="fade"></div>
    <div id="loading"><div class="spinner"></div><span></span></div>

    <div id="pause">
      <div class="pause-card">
        <h2>⏸ Paused</h2>
        <p>Click anywhere to jump back in.</p>
        <div class="pause-controls"></div>
        <button class="btn ghost" data-action="start">⟲ Back to the title screen</button>
      </div>
    </div>

    <div id="start"></div>
    <div id="modal-root"></div>

    <script type="module" src="/js/boot.js"></script>
  </body>
</html>
